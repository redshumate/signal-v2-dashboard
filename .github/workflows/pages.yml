name: Publish read-only Signal snapshot
on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: Sanitized compressed display snapshot
        required: true
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: signal-public-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare safe static artifact
        env:
          SNAPSHOT: ${{ inputs.snapshot }}
        run: |
          mkdir -p site
          cp index.html site/index.html
          touch site/.nojekyll
          node --input-type=module <<'JS'
          import {gunzipSync} from 'node:zlib';
          import fs from 'node:fs';
          const raw=gunzipSync(Buffer.from(process.env.SNAPSHOT,'base64'),{maxOutputLength:1048576}).toString();
          const s=JSON.parse(raw);
          const allowed=['schema_version','generated_at','stale_after_seconds','market_open','data_freshness','date','status','accounts','chart','activity','validity','lastSession','cleanEra','paperOnly','liveMoneyEnabled'];
          if(Object.keys(s).some(k=>!allowed.includes(k))||s.paperOnly!==true||s.liveMoneyEnabled!==false||s.schema_version!==1||!Number.isFinite(Date.parse(s.generated_at)))throw new Error('Invalid public snapshot');
          if(/ALPACA|secret|token|password|computername|hostname|C:\\\\|database_path|diagnostics|session_id|positionId|signalId/i.test(raw))throw new Error('Unsafe field in public snapshot');
          fs.writeFileSync('site/snapshot.json',JSON.stringify(s));
          JS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 1
      - name: Deploy read-only dashboard
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public HTTPS from the hosted runner
        timeout-minutes: 5
        env:
          SNAPSHOT: ${{ inputs.snapshot }}
          PUBLIC_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'JS'
          import {gunzipSync} from 'node:zlib';
          const expected=JSON.parse(gunzipSync(Buffer.from(process.env.SNAPSHOT,'base64')));
          let good=false;
          let lastError='';
          for(let attempt=0;attempt<18;attempt++){
            try{
              const response=await fetch(process.env.PUBLIC_URL+'snapshot.json?t='+Date.now(),{cache:'no-store'});
              if(response.ok){
                const actual=await response.json();
                if(actual.generated_at===expected.generated_at&&actual.paperOnly===true&&actual.liveMoneyEnabled===false){
                  good=true;
                  break;
                }
                lastError='snapshot served, but generated_at has not propagated yet';
              }else{
                lastError='HTTP '+response.status;
              }
            }catch(error){
              lastError=String(error);
            }
            if(attempt<17)await new Promise(resolve=>setTimeout(resolve,10000));
          }
          if(!good){
            console.log('::warning::GitHub Pages deployment succeeded, but the newest snapshot did not propagate within the verification window. Treating this as a Pages propagation delay, not a publish failure. Last check: '+lastError);
            process.exit(0);
          }
          const htmlResponse=await fetch(process.env.PUBLIC_URL+'?t='+Date.now(),{cache:'no-store'});
          if(!htmlResponse.ok)throw new Error('Public page smoke test HTTP '+htmlResponse.status);
          const html=await htmlResponse.text();
          if(!html.includes('Last updated')||/\/api\/|ALPACA|computername|hostname|127\.0\.0\.1|diagnosticsBody/.test(html))throw new Error('Public page smoke test failed');
          console.log('Public HTTPS snapshot and read-only dashboard verified outside the local machine.');
          JS
