<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Signal V2</title><style>
:root{color-scheme:dark;--bg:#081019;--panel:#111d29;--line:#24384b;--text:#edf5ff;--muted:#8fa5ba;--green:#61d69a;--amber:#f4c96b;--red:#ff7e79;--blue:#68a8ff;--cyan:#59d4df}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}.shell{max-width:1280px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}h1{margin:0;font-size:30px;letter-spacing:-.03em}h2{font-size:18px;margin:0 0 14px}h3{font-size:14px;color:var(--muted);margin:0 0 10px;text-transform:uppercase;letter-spacing:.08em}.nav{display:flex;gap:8px}.nav button,.toggle button{border:1px solid var(--line);background:#0c1621;color:var(--muted);padding:8px 12px;border-radius:8px;cursor:pointer}.nav button.active,.toggle button.active{background:#1c3349;color:var(--text);border-color:#416786}.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}.status,.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}.status{padding:12px}.status small{display:block;color:var(--muted);font-weight:700;font-size:11px;letter-spacing:.08em;margin-bottom:5px}.badge{font-weight:800;font-size:15px}.good{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}.account-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}.card{padding:18px;overflow-x:auto}.hero{font-size:31px;font-weight:800;letter-spacing:-.03em}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{font-size:17px}.cash{padding:14px;background:#0c1621;border-radius:9px;color:var(--muted);font-weight:800}.holdings{width:100%;border-collapse:collapse;margin-top:10px}.holdings th,.holdings td{padding:7px 5px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.panel{padding:18px;margin-bottom:14px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.chart{width:100%;height:330px;display:block;background:#0a141e;border-radius:10px;margin-top:12px}.chart-empty{height:260px;display:grid;place-items:center;color:var(--muted)}.lower{display:grid;grid-template-columns:1.35fr .9fr;gap:14px}.stack{display:grid;gap:14px}.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.mini{background:#0c1621;padding:10px;border-radius:8px}.mini span{display:block;color:var(--muted);font-size:11px}.mini strong{font-size:17px}.activity{width:100%;border-collapse:collapse}.activity th,.activity td{padding:8px 5px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.validity-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.failure{margin-top:12px;padding:10px;border-radius:8px;background:#35191b;color:#ffb1ad}.last-title{display:flex;align-items:center;justify-content:space-between}.muted{color:var(--muted)}.score-accounts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.score-account{background:#0c1621;padding:12px;border-radius:8px}.diagnostics{display:none}.diagnostics.active{display:block}.overview.hidden{display:none}pre{white-space:pre-wrap;word-break:break-word;background:#071019;border:1px solid var(--line);border-radius:10px;padding:16px;color:#b9cce0}.foot{color:var(--muted);font-size:12px;margin-top:12px}@media(max-width:850px){.strip{grid-template-columns:repeat(2,1fr)}.account-grid,.lower{grid-template-columns:1fr}.stat-grid{grid-template-columns:repeat(2,1fr)}.score-accounts{grid-template-columns:1fr}.shell{padding:14px}.activity{display:block;overflow:auto}}
</style></head><body><div class="shell"><header><h1>SIGNAL V2</h1><div class="muted">Read-only · Paper only</div></header><main id="overview" class="overview"><p id="updated" class="muted">Loading published snapshot…</p><div id="statusStrip" class="strip"></div><div id="accountGrid" class="account-grid"></div><section class="panel"><div class="panel-head"><h2>PERFORMANCE TODAY</h2><div class="toggle"><button id="normalizedBtn" class="active">Normalized Day</button><button id="rollingBtn">Actual Rolling</button><button id="equityBtn" class="active">$ Equity</button><button id="percentBtn">% Today</button></div></div><div id="chart"></div></section><div class="lower"><section class="panel"><h2>TODAY</h2><div id="todayStats" class="stat-grid"></div><div style="overflow:auto"><table class="activity"><thead><tr><th>TIME CT</th><th>ACCOUNT</th><th>SYMBOL</th><th>EVENT</th><th>PRICE</th></tr></thead><tbody id="activityRows"></tbody></table></div></section><div class="stack"><section class="panel"><h2>SESSION VALIDITY</h2><div id="validity"></div></section><section class="panel"><h2>LAST SESSION</h2><div id="lastSession"></div></section><section class="panel"><h2>CLEAN V2 PERFORMANCE</h2><div id="cleanEra"></div></section></div></div><div class="foot">Paper only · Live money disabled</div></main></div><script>
let state=null,chartMode='equity',accountingView='normalized';const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n??0)),pct=n=>(Number(n??0)>=0?'+':'')+Number(n??0).toFixed(2)+'%',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),timeET=v=>v?new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',hour:'numeric',minute:'2-digit',second:'2-digit'}).format(new Date(v)):'—',dateLabel=v=>v?new Intl.DateTimeFormat('en-US',{timeZone:'UTC',month:'short',day:'numeric'}).format(new Date(v+'T12:00:00Z')):'—';
function tone(v){if(String(v).includes(' / 3'))return Number(String(v).split(' / ')[0])>=3?'good':'warn';return ['RUNNING','FRESH','CLEAN SO FAR','COMPLETE','GO','PASS','HEALTHY','ELIGIBLE'].includes(v)?'good':['PENDING','DELAYED','DEGRADED'].includes(v)?'warn':'bad'}function statusCard(label,value){return '<div class="status"><small>'+label+'</small><div class="badge '+tone(value)+'">'+esc(value)+'</div></div>'}
function accountCard(a){const positions=a.openPositions.length?a.openPositions.map(p=>'<tr><td>'+esc(p.symbol)+'</td><td>'+esc(String(p.direction).toUpperCase())+'</td><td>'+money(p.entryPrice)+'</td><td>'+money(p.currentPrice)+'</td><td class="'+(p.pnlPct>=0?'good':'bad')+'">'+pct(p.pnlPct)+'</td></tr>').join(''):'<div class="cash">CASH</div>';const table=a.openPositions.length?'<table class="holdings"><thead><tr><th>SYMBOL</th><th>DIR</th><th>ENTRY</th><th>CURRENT</th><th>P&amp;L</th></tr></thead><tbody>'+positions+'</tbody></table>':positions;return '<article class="card"><h3>'+esc(a.label)+'</h3><div class="muted">Actual rolling equity</div><div class="hero">'+money(a.equity)+'</div><p>Today normalized: <strong>'+money(a.normalized_end_equity)+' / '+pct(a.normalized_daily_return_pct)+'</strong></p><div class="metrics"><div class="metric"><span>Today actual P&amp;L</span><strong class="'+(a.todayPnl>=0?'good':'bad')+'">'+money(a.todayPnl)+'</strong></div><div class="metric"><span>Actual return</span><strong class="'+(a.todayReturnPct>=0?'good':'bad')+'">'+pct(a.todayReturnPct)+'</strong></div><div class="metric"><span>'+(a.accountId==='SINGLE_500'?'Cash':'Buying power')+'</span><strong>'+money(a.accountId==='SINGLE_500'?a.cash:a.buyingPower)+'</strong></div><div class="metric"><span>Positions</span><strong>'+a.openPositions.length+' / '+(a.accountId==='SINGLE_500'?1:5)+'</strong></div><div class="metric"><span>Trades today</span><strong>'+a.tradesToday+'</strong></div><div class="metric"><span>Signals skipped</span><strong>'+a.signalsSkipped+'</strong></div></div>'+table+'</article>'}
function minuteET(v){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(v));return Number(parts.find(p=>p.type==='hour').value)*60+Number(parts.find(p=>p.type==='minute').value)}
function drawChart(){const root=$('chart'),series=[['SINGLE_500','#68a8ff'],['FIVE_500','#59d4df']],opening=Object.fromEntries(state.accounts.map(a=>[a.accountId,accountingView==='normalized'?500:a.openingEquity]));let points=[];for(const [id,color] of series)for(const m of (accountingView==='normalized'?state.chart.normalizedMarks:state.chart.marks)[id]||[]){const minute=minuteET(m.occurredAt);if(minute>=510&&minute<=900)points.push({id,color,minute,at:m.occurredAt,value:chartMode==='percent'?(opening[id]>0?(Number(m.equity)-opening[id])/opening[id]*100:0):Number(m.equity),equity:Number(m.equity)});}for(const [id,color] of series){if(points.some(p=>p.id===id))points.unshift({id,color,minute:510,value:chartMode==='percent'?0:opening[id]});}if(!points.length){root.innerHTML='<div class="chart-empty">Equity marks will appear during the 8:30 AM–3:00 PM CT session.</div>';return}const W=1000,H=320,L=58,R=24,T=22,B=42,values=points.map(p=>p.value);let min=Math.min(...values),max=Math.max(...values);if(chartMode==='percent'){min=Math.min(min,0);max=Math.max(max,0)}if(max===min){max+=1;min-=1}const pad=(max-min)*.12;min-=pad;max+=pad;const x=m=>L+(m-510)/(900-510)*(W-L-R),y=v=>T+(max-v)/(max-min)*(H-T-B);let svg='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Single and Five Slot equity today">';for(let i=0;i<=6;i++){const minute=510+i*65,xx=x(minute),hour=Math.floor(minute/60),mins=minute%60,label=((hour+11)%12+1)+':'+String(mins).padStart(2,'0');svg+='<line x1="'+xx+'" y1="'+T+'" x2="'+xx+'" y2="'+(H-B)+'" stroke="#1b2b3a"/><text x="'+xx+'" y="'+(H-15)+'" fill="#7890a7" text-anchor="middle" font-size="12">'+label+'</text>'}for(let i=0;i<=4;i++){const value=min+(max-min)*i/4,yy=y(value);svg+='<line x1="'+L+'" y1="'+yy+'" x2="'+(W-R)+'" y2="'+yy+'" stroke="#1b2b3a"/><text x="'+(L-8)+'" y="'+(yy+4)+'" fill="#7890a7" text-anchor="end" font-size="11">'+(chartMode==='percent'?value.toFixed(2)+'%':'$'+value.toFixed(0))+'</text>'}if(chartMode==='percent'&&min<=0&&max>=0)svg+='<line x1="'+L+'" y1="'+y(0)+'" x2="'+(W-R)+'" y2="'+y(0)+'" stroke="#91a3b7" stroke-dasharray="6 5"/>';for(const [id,color] of series){const rows=points.filter(p=>p.id===id).sort((a,b)=>a.minute-b.minute);if(rows.length)svg+='<polyline fill="none" stroke="'+color+'" stroke-width="3" points="'+rows.map(p=>x(p.minute)+','+y(p.value)).join(' ')+'"/>'}for(const marker of state.chart.markers){const rows=points.filter(p=>p.id===marker.accountId),near=rows.reduce((best,p)=>!best||Math.abs(p.minute-minuteET(marker.occurredAt))<Math.abs(best.minute-minuteET(marker.occurredAt))?p:best,null);if(!near)continue;svg+='<circle cx="'+x(minuteET(marker.occurredAt))+'" cy="'+y(near.value)+'" r="5" fill="'+(marker.event==='ENTRY'?'#61d69a':'#ff7e79')+'"><title>'+esc(marker.event+' '+marker.symbol+' '+money(marker.price)+' · '+timeET(marker.occurredAt))+'</title></circle>'}svg+='<g font-size="12"><circle cx="'+(W-245)+'" cy="16" r="5" fill="#68a8ff"/><text x="'+(W-234)+'" y="20" fill="#cfe1f2">Single Slot</text><circle cx="'+(W-135)+'" cy="16" r="5" fill="#59d4df"/><text x="'+(W-124)+'" y="20" fill="#cfe1f2">Five Slot</text></g></svg>';root.innerHTML=svg}
function render(){const s=state;$('statusStrip').innerHTML=statusCard('RUNNER',s.status.runner)+statusCard('FEED',s.status.feed)+statusCard('TODAY',s.status.today)+statusCard('CLEAN STREAK',s.status.cleanStreak+' / '+s.status.cleanTarget)+statusCard('EOD',s.status.eod);$('accountGrid').innerHTML=s.accounts.map(accountCard).join('');drawChart();const a=s.activity,$stats=[['Raw signals',a.rawSignalsObserved],['Single trades',a.singleTradesTaken],['Five trades',a.fiveTradesTaken],['Open positions',a.openPositions],['Single skipped',a.singleSkipped],['Five skipped',a.fiveSkipped],['Last signal',timeET(a.lastSignalTime)],['Last trade',timeET(a.lastTradeTime)]];$('todayStats').innerHTML=$stats.map(x=>'<div class="mini"><span>'+x[0]+'</span><strong>'+x[1]+'</strong></div>').join('');$('activityRows').innerHTML=a.rows.map(r=>'<tr><td>'+timeET(r.occurredAt)+'</td><td>'+esc(r.account)+'</td><td>'+esc(r.symbol)+'</td><td>'+esc(r.event)+'</td><td>'+(r.price==null?'—':money(r.price))+'</td></tr>').join('')||'<tr><td colspan="5" class="muted">No activity yet.</td></tr>';const v=s.validity,rows=[['8:20 preflight',v.preflight0820],['8:27 preflight',v.preflight0827],['8:29 GO/NO-GO',v.hardGate0829],['8:31 post-open proof',v.postOpen0831],['Watchdog',v.watchdog],['EOD',v.eod]];$('validity').innerHTML=rows.map(r=>'<div class="validity-row"><span>'+r[0]+'</span><strong class="'+tone(r[1])+'">'+esc(r[1])+'</strong></div>').join('')+(v.failureReason?'<div class="failure"><strong>'+esc(v.failureReason)+'</strong><br>'+esc(v.failedChecks.join(', '))+'</div>':'');const last=s.lastSession;$('lastSession').innerHTML=last?'<div class="last-title"><strong>'+dateLabel(last.date)+'</strong><strong class="'+tone(last.status)+'">'+last.status+'</strong></div><p>Single '+(last.returns.SINGLE_500==null?'—':pct(last.returns.SINGLE_500))+' · Five '+(last.returns.FIVE_500==null?'—':pct(last.returns.FIVE_500))+'</p><p>'+last.signalsObserved+' signals · '+last.trades+' trades · EOD <span class="'+tone(last.eodStatus)+'">'+esc(last.eodStatus)+'</span></p>'+(last.reason?'<p class="muted">'+esc(last.reason)+'</p>':''):'No completed prior session.';const c=s.cleanEra;if(!c.established)$('cleanEra').innerHTML='<p><strong>Eligible sessions: '+c.eligibleSessionCount+'</strong></p><p class="muted">Not enough clean sessions yet</p>';else $('cleanEra').innerHTML='<p><strong>Eligible sessions: '+c.eligibleSessionCount+'</strong></p><div class="score-accounts">'+Object.entries(c.accounts).map(([id,x])=>'<div class="score-account"><strong>'+esc(id==='SINGLE_500'?'Single':'Five')+'</strong><p>Clean-era return <span class="'+(x.cumulativeReturnPct>=0?'good':'bad')+'">'+pct(x.cumulativeReturnPct)+'</span></p><p>Avg daily '+pct(x.averageDailyReturnPct)+'</p><p>Best '+(x.bestCleanDay?pct(x.bestCleanDay.returnPct):"—")+' · Worst '+(x.worstCleanDay?pct(x.worstCleanDay.returnPct):"—")+'</p></div>').join('')+'</div>'}
function publicationAge(){if(!state)return;const stale=(Date.now()-Date.parse(state.generated_at))/1000>state.stale_after_seconds;document.getElementById('updated').textContent=(stale?'STALE — ':'')+'Last updated '+timeET(state.generated_at)+' CT'+(state.market_open?'':' · Market closed');document.getElementById('updated').className=stale?'failure':'muted';if(stale){$('statusStrip').innerHTML=statusCard('PUBLICATION','STALE')+statusCard('RUNNER','UNKNOWN')+statusCard('FEED','UNKNOWN')+statusCard('TODAY',state.status.today)+statusCard('EOD',state.status.eod)}}
async function load(){try{const response=await fetch('snapshot.json?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw new Error('Snapshot unavailable');state=await response.json();render();publicationAge()}catch(error){$('statusStrip').innerHTML=statusCard('PUBLICATION','STALE');document.getElementById('updated').textContent='Snapshot unavailable — retrying';document.getElementById('updated').className='failure'}}$('normalizedBtn').onclick=()=>{accountingView='normalized';$('normalizedBtn').classList.add('active');$('rollingBtn').classList.remove('active');drawChart()};$('rollingBtn').onclick=()=>{accountingView='rolling';$('rollingBtn').classList.add('active');$('normalizedBtn').classList.remove('active');drawChart()};$('equityBtn').onclick=()=>{chartMode='equity';$('equityBtn').classList.add('active');$('percentBtn').classList.remove('active');drawChart()};$('percentBtn').onclick=()=>{chartMode='percent';$('percentBtn').classList.add('active');$('equityBtn').classList.remove('active');drawChart()};load();setInterval(load,30000);setInterval(publicationAge,10000);
</script></body></html>
